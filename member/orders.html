<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>

    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/member/orders.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Noto+Sans+TC:wght@100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div id="header"></div>

    <main class="orders-page">
        <h1 class="orders-title">My Orders</h1>

        <div class="orders-list">

            <div class="order-card">
                <div class="order-header">
                    <span class="order-id"></span>
                    <span class="order-time"></span>
                </div>

                <div class="order-body">
                    <div class="order-info">
                        <span class="label">Payment</span>
                        <span class="value"></span>
                    </div>

                    <div class="order-info">
                        <span class="label">Total</span>
                        <span class="value"></span>
                    </div>

                    <div class="order-info">
                        <span class="label">Qty</span>
                        <span class="value"></span>
                    </div>
                </div>

                <div class="order-footer">
                    <button class="view-order-btn">View Details</button>
                </div>
            </div>


            <div class="orders-empty">
                <p>- No orders -</p>
            </div>


        </div>
    </main>

    <div id="footer"></div>
</body>

<script src="/js/layout.js"></script>
<script src="/member/orders.js"></script>

</html>
