<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>

    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/receipt.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Noto+Sans+TC:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="header"></div>

    <main class="receipt-page">
        <h1 class="receipt-title">Receipt</h1>

        <div class="receipt-card">
            <div class="receipt-section">
                <div class="receipt-row">
                    <span class="label">Order ID</span>
                    <span class="value" id="receipt-order-id">—</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Order Time</span>
                    <span class="value" id="receipt-order-time">—</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Payment</span>
                    <span class="value" id="receipt-payment">—</span>
                </div>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-section">
                <h3 class="section-title">Items</h3>

                <div class="receipt-items" id="receipt-items"></div>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-section">
                <div class="receipt-row">
                    <span class="label">Products</span>
                    <span class="value" id="receipt-products"></span>
                </div>
                <div class="receipt-row">
                    <span class="label">Shipping</span>
                    <span class="value" id="receipt-shipping"></span>
                </div>
                <div class="receipt-row">
                    <span class="label">Assembly</span>
                    <span class="value" id="receipt-assembly"></span>
                </div>
                <div class="receipt-row">
                    <span class="label">Discount</span>
                    <span class="value" id="receipt-discount"></span>
                </div>
            </div>

            <div class="receipt-section">
                <div class="receipt-row total">
                    <span class="label">Total</span>
                    <span class="value" id="receipt-total"></span>
                </div>
            </div>
        </div>

        <div class="receipt-actions">
            <button id="download-receipt-btn">Download as png</button>
            <a href="/index.html" class="receipt-btn secondary">Back to Home</a>
            <a href="/member/orders.html" class="receipt-btn primary">View Orders</a>
        </div>
    </main>

    <div id="footer"></div>
</body>

<script src="/js/layout.js"></script>
<script src="/js/receipt.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</html>
