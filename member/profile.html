<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/member/profile.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Noto+Sans+TC:wght@100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div id="header"></div>

    <main class="profile-page">
        <section class="profile-card">
            <h1 class="profile-title" data-i18n="profile.myProfile">My Profile</h1>

            <div class="profile-row">
                <span class="profile-label" data-i18n="profile.userId">User ID</span>
                <span class="profile-value" id="profile-id">—</span>
            </div>

            <div class="profile-row">
                <span class="profile-label" data-i18n="memberName">Name</span>
                <span class="profile-value" id="profile-name">—</span>
            </div>

            <div class="profile-row">
                <span class="profile-label" data-i18n="email">Email</span>
                <span class="profile-value" id="profile-email">—</span>
            </div>

            <div class="profile-row profile-address">
                <span class="profile-label" data-i18n="profile.address">Address</span>
                <span class="profile-value" id="profile-address-display">—</span>
                <input type="text" id="profile-address" class="profile-input" data-i18n-placeholder="profile.enterAddress" />
            </div>

            <div class="profile-actions">
                <button class="profile-save-btn" disabled data-i18n="profile.saveAddress">
                    Save Address
                </button>
            </div>
        </section>
    </main>

    <div id="footer"></div>
</body>

<script src="/js/layout.js"></script>
<script src="/member/profile.js"></script>

</html>
